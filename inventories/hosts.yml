all:
  vars:
    ansible_ssh_extra_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
    ansible_ssh_private_key_file: /path/to/your/private/key
    ansible_user: root
    ansible_python_interpreter: /path/to/your/python
  children:
    cluster:
      children:
        master:
          children:
            m01:
              hosts: k8s-m01
              vars:
                ansible_host: [ hostip ]
            m02:
              hosts: k8s-m02
              vars:
                ansible_host: [ hostip ]
            m03:
              hosts: k8s-m03
              vars:
                ansible_host: [ hostip ]
        worker:
          children:
            w01:
              hosts: k8s-w01
              vars:
                ansible_host: [ hostip ]
            w02:
              hosts: k8s-w02
              vars:
                ansible_host: [ hostip ]
            w03:
              hosts: k8s-w03
              vars:
                ansible_host: [ hostip ]
