apiVersion: v1
kind: Pod
metadata:
  name: gpu-utilization-test
  namespace: gpu
spec:
  runtimeClassName: nvidia
  nodeSelector:
    accelerator: nvidia-gpu
  tolerations:
  - key: "accelerator"
    operator: "Equal"
    value: "nvidia-gpu"
    effect: "NoSchedule"
  restartPolicy: OnFailure
  containers:
  - name: cuda-sample
    # This is an official NVIDIA sample image for testing
    image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda11.6.0
    resources:
      limits:
        nvidia.com/gpu: 1
    command: [ "/bin/sh", "-c" ]
    args:
    - "while true; do /tmp/vectorAdd; sleep 1; done"
