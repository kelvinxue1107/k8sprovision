apiVersion: v1
kind: Pod
metadata:
  name: gpu-test-pod
spec:
  runtimeClassName: nvidia

  # This now matches your existing label exactly.
  nodeSelector:
    accelerator: nvidia-gpu

  # This toleration allows the pod to run on the tainted GPU node.
  tolerations:
  - key: "accelerator"
    operator: "Equal"
    value: "nvidia-gpu"
    effect: "NoSchedule"

  restartPolicy: OnFailure
  containers:
  - name: cuda-container
    image: nvcr.io/nvidia/cuda:12.4.1-base-ubi9
    resources:
      limits:
        nvidia.com/gpu: 1
    command: [ "/bin/sh", "-c" ]
    args:
    - |
      while true; do
        echo "--- Timestamp: $(date) ---";
        nvidia-smi;
        sleep 10;
      done
