# code-server-pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: code-server-pvc
  namespace: code-server
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi # Modify this based on your needs
  # Specify a StorageClass if available in your cluster (e.g., "nfs", "rook-ceph")
  # storageClassName: "<YOUR_STORAGE_CLASS>"
